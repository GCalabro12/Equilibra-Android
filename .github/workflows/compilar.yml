name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Versión (la misma numeración que la web)
        run: echo "VERSION_NAME=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Clave de firma
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/clave.p12"

      - name: Compilar
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/clave.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/release/app-release.apk Equilibra.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Equilibra v${{ env.VERSION_NAME }}
          body: |
            Descarga **Equilibra.apk** en el móvil y ábrelo para instalar o actualizar.
            Enlace fijo a la última versión: https://github.com/${{ github.repository }}/releases/latest/download/Equilibra.apk
          files: Equilibra.apk
          make_latest: true
